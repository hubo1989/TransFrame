name: windows-ci

on:
  push:
    branches: [main, "hubo/**"]
    paths:
      - "windows/**"
      - ".github/workflows/windows-ci.yml"
  pull_request:
    paths:
      - "windows/**"
      - ".github/workflows/windows-ci.yml"
  workflow_dispatch:

jobs:
  core-tests:
    # Task A: solution skeleton + portable core models/algorithms.
    name: Core tests (MSVC ${{ matrix.platform }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [x64, ARM64]
        configuration: [Release]
    steps:
      - uses: actions/checkout@v4

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Build solution
        working-directory: windows
        run: msbuild TransFrame.sln /m /p:Configuration=${{ matrix.configuration }} /p:Platform=${{ matrix.platform }} /warnaserror /verbosity:minimal

      - name: Run Catch2 tests
        # x64 runner cannot execute ARM64 binaries (no emulation on
        # windows-latest); ARM64 leg proves compile+link only.
        # Run from windows/ so the fixture path Tests/fixtures/... resolves
        # cwd-relative (same as the local dev invocation).
        if: matrix.platform == 'x64'
        working-directory: windows
        shell: pwsh
        run: |
          & ".\build\${{ matrix.platform }}\${{ matrix.configuration }}\TransFrame.Core.Tests\TransFrame.Core.Tests.exe"
          exit $LASTEXITCODE

      - name: Upload test binaries on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: core-tests-${{ matrix.platform }}-${{ matrix.configuration }}
          path: windows/build
          if-no-files-found: ignore

  native-shell-tests:
    # Task B: capture shell. Portable policy core + (on Windows) Win32/D2D/WGC TUs.
    name: NativeShell (MSVC ${{ matrix.platform }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [x64, ARM64]
        configuration: [Release]
    steps:
      - uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -S windows/NativeShell -B windows/NativeShell/build -A ${{ matrix.platform }} -DCMAKE_BUILD_TYPE=${{ matrix.configuration }}

      - name: Build
        run: cmake --build windows/NativeShell/build --config ${{ matrix.configuration }} --parallel

      - name: Run Catch2 tests
        # x64 runner cannot execute ARM64 binaries (no emulation on
        # windows-latest); ARM64 leg proves compile+link only.
        if: matrix.platform == 'x64'
        working-directory: windows/NativeShell/build/${{ matrix.configuration }}
        run: .\native_shell_tests.exe

      - name: Upload test binaries on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nativeshell-tests-${{ matrix.platform }}-${{ matrix.configuration }}
          path: windows/NativeShell/build
          if-no-files-found: ignore

  translation-tests:
    # Task C: translation/OCR services. Core (portable) Catch2 tests on
    # MSVC x64 + ARM64; NativeShell Win32/WinRT TUs compile+link into the
    # smoke target (running it needs a GUI session - see windows/README.md).
    name: Translation services (MSVC ${{ matrix.platform }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [x64, ARM64]
        configuration: [Release]
    steps:
      - uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -S windows -B windows/build -A ${{ matrix.platform }} -DCMAKE_BUILD_TYPE=${{ matrix.configuration }}

      - name: Build
        run: cmake --build windows/build --config ${{ matrix.configuration }} --parallel

      - name: Run Catch2 tests (Core)
        # x64 runner cannot execute ARM64 binaries (no emulation on
        # windows-latest); ARM64 leg proves compile+link only.
        if: matrix.platform == 'x64'
        working-directory: windows/build/${{ matrix.configuration }}
        run: .\translation_tests.exe

      - name: Upload test binaries on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: translation-tests-${{ matrix.platform }}-${{ matrix.configuration }}
          path: windows/build
          if-no-files-found: ignore

  portable-check:
    # Prove the portable layers stay platform-clean: the same sources
    # compile under GCC on Linux (no Win32 leaks).
    name: Portable checks (GCC, ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install compiler
        run: sudo apt-get update && sudo apt-get install -y g++-13 cmake

      - name: Core (task A) — build and run Catch2 tests
        working-directory: windows
        run: |
          g++-13 -std=c++20 -Wall -Wextra -Werror \
            -I . -I Core -I external \
            Core/*.cpp external/catch2/catch_amalgamated.cpp Tests/*.cpp \
            -o ../build-tests 2>&1 | head -80
          ../build-tests

      - name: NativeShell (task B) — configure, build, test
        run: |
          cmake -S windows/NativeShell -B windows/NativeShell/build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=g++-13
          cmake --build windows/NativeShell/build --parallel
          windows/NativeShell/build/native_shell_tests

      - name: Translation (task C) — configure, build, test
        run: |
          cmake -S windows -B windows/build-c -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=g++-13
          cmake --build windows/build-c --parallel
          windows/build-c/translation_tests
