name: windows-ci

on:
  push:
    branches: [main, "hubo/**"]
    paths:
      - "windows/**"
      - ".github/workflows/windows-ci.yml"
  pull_request:
    paths:
      - "windows/**"
      - ".github/workflows/windows-ci.yml"
  workflow_dispatch:

# Least privilege: these jobs only read code and upload artifacts.
permissions:
  contents: read

# Supersede stale runs on the same ref instead of queueing redundant builds.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-tests:
    # Task A: solution skeleton + portable core models/algorithms.
    name: Core tests (MSVC ${{ matrix.platform }})
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        platform: [x64, ARM64]
        configuration: [Release]
    steps:
      - uses: actions/checkout@v4

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Build solution
        # -restore: the solution references WASDK/CppWinRT via
        # PackageReference (WinUI3Shell + App); a fresh runner has no
        # packages until NuGet restore runs.
        working-directory: windows
        run: msbuild TransFrame.sln /m /restore /p:Configuration=${{ matrix.configuration }} /p:Platform=${{ matrix.platform }} /warnaserror /verbosity:minimal

      - name: Run Catch2 tests
        # x64 runner cannot execute ARM64 binaries (no emulation on
        # windows-latest); ARM64 leg proves compile+link only.
        # Run from windows/ so the fixture path Tests/fixtures/... resolves
        # cwd-relative (same as the local dev invocation).
        if: matrix.platform == 'x64'
        working-directory: windows
        shell: pwsh
        run: |
          & ".\build\${{ matrix.platform }}\${{ matrix.configuration }}\TransFrame.Core.Tests\TransFrame.Core.Tests.exe"
          exit $LASTEXITCODE

      - name: Upload test binaries on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: core-tests-${{ matrix.platform }}-${{ matrix.configuration }}
          path: windows/build
          if-no-files-found: ignore

  native-shell-tests:
    # Task B: capture shell. Portable policy core + (on Windows) Win32/D2D/WGC TUs.
    name: NativeShell (MSVC ${{ matrix.platform }})
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        platform: [x64, ARM64]
        configuration: [Release]
    steps:
      - uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -S windows/NativeShell -B windows/NativeShell/build -A ${{ matrix.platform }} -DCMAKE_BUILD_TYPE=${{ matrix.configuration }}

      - name: Build
        run: cmake --build windows/NativeShell/build --config ${{ matrix.configuration }} --parallel

      - name: Run Catch2 tests
        # x64 runner cannot execute ARM64 binaries (no emulation on
        # windows-latest); ARM64 leg proves compile+link only.
        if: matrix.platform == 'x64'
        working-directory: windows/NativeShell/build/${{ matrix.configuration }}
        run: .\native_shell_tests.exe

      - name: Upload test binaries on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nativeshell-tests-${{ matrix.platform }}-${{ matrix.configuration }}
          path: windows/NativeShell/build
          if-no-files-found: ignore

  translation-tests:
    # Task C: translation/OCR services. Core (portable) Catch2 tests on
    # MSVC x64 + ARM64; NativeShell Win32/WinRT TUs compile+link into the
    # smoke target (running it needs a GUI session - see windows/README.md).
    name: Translation services (MSVC ${{ matrix.platform }})
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        platform: [x64, ARM64]
        configuration: [Release]
    steps:
      - uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -S windows -B windows/build -A ${{ matrix.platform }} -DCMAKE_BUILD_TYPE=${{ matrix.configuration }}

      - name: Build
        run: cmake --build windows/build --config ${{ matrix.configuration }} --parallel

      - name: Run Catch2 tests (Core)
        # x64 runner cannot execute ARM64 binaries (no emulation on
        # windows-latest); ARM64 leg proves compile+link only.
        if: matrix.platform == 'x64'
        working-directory: windows/build/${{ matrix.configuration }}
        run: .\translation_tests.exe

      - name: Upload test binaries on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: translation-tests-${{ matrix.platform }}-${{ matrix.configuration }}
          path: windows/build
          if-no-files-found: ignore

  portable-check:
    # Prove the portable layers stay platform-clean: the same sources
    # compile under GCC on Linux (no Win32 leaks).
    name: Portable checks (GCC, ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Validate MSIX update descriptors
        run: python3 -m unittest discover -s windows/scripts -v

      - name: Install compiler
        run: sudo apt-get update && sudo apt-get install -y g++-13 cmake

      - name: Core (task A) — build and run Catch2 tests
        working-directory: windows
        shell: bash
        run: |
          set -euo pipefail
          g++-13 -std=c++20 -Wall -Wextra -Werror \
            -I . -I Core -I external \
            Core/*.cpp external/catch2/catch_amalgamated.cpp \
            Tests/TestMain.cpp Tests/CoreModelsTests.cpp Tests/LLMTranslationCoreTestsA.cpp \
            Tests/TranslationPromptConfigTests.cpp Tests/VisualLineGroupingTests.cpp \
            -o ../build-tests 2>&1 | head -400
          ../build-tests

      - name: NativeShell (task B) — configure, build, test
        run: |
          cmake -S windows/NativeShell -B windows/NativeShell/build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=g++-13
          cmake --build windows/NativeShell/build --parallel
          windows/NativeShell/build/native_shell_tests

      - name: Translation (task C) — configure, build, test
        run: |
          cmake -S windows -B windows/build-c -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=g++-13
          cmake --build windows/build-c --parallel
          windows/build-c/translation_tests
  msix-package:
    # FR-38 packaging leg: per-architecture MSIX + App Installer feed,
    # signed with a disposable self-signed test certificate (CI has no
    # real cert; the artifacts are install-test only, never shipped).
    name: MSIX package (${{ matrix.platform }})
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        platform: [x64, ARM64]
    env:
      PUBLISHER: CN=TransFrame CI Test
      BASE_URL: https://transframe.example/downloads/windows
      VCLIBS_VERSION: 14.0.33728.0
    steps:
      - uses: actions/checkout@v4

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Build solution (Release)
        working-directory: windows
        run: msbuild TransFrame.sln /m /restore /p:Configuration=Release /p:Platform=${{ matrix.platform }} /warnaserror /verbosity:minimal

      - name: Download VCLibs Desktop runtime (fixed version)
        shell: pwsh
        run: |
          $arch = '${{ matrix.platform }}'.ToLower()
          $url = "https://www.nuget.org/api/v2/package/Microsoft.VCLibs.Desktop/$env:VCLIBS_VERSION"
          $out = "vclibs-$arch.appx"
          try {
            Invoke-WebRequest -Uri $url -OutFile $out -UseBasicParsing -TimeoutSec 120
          } catch {
            Write-Error "Failed to download VCLibs Desktop $env:VCLIBS_VERSION from $url : $_"
            exit 1
          }
          if ((Get-Item $out).Length -eq 0) { Write-Error "Downloaded $out is empty"; exit 1 }
          $zip = "$out.zip"
          Rename-Item $out $zip
          Expand-Archive $zip -DestinationPath "vclibs-$arch" -Force
          $appx = Get-ChildItem "vclibs-$arch/tools/AppX" -Filter "*$arch.appx" | Select-Object -First 1
          if (-not $appx) { Write-Error "No $arch appx inside the VCLibs nupkg"; exit 1 }
          Copy-Item $appx.FullName "vclibs-$arch-extracted.appx"
          Write-Host "VCLibs: $($appx.Name)"

      - name: Package + sign MSIX (self-signed test cert)
        shell: pwsh
        run: |
          $exe = "windows/build/${{ matrix.platform }}/Release/TransFrame.App/TransFrame.App.exe"
          if (-not (Test-Path $exe)) { Write-Error "EXE not found: $exe"; exit 1 }
          $bootstrap = Join-Path (Split-Path $exe) "Microsoft.WindowsAppRuntime.Bootstrap.dll"
          if (-not (Test-Path $bootstrap)) { Write-Error "Bootstrap DLL missing next to EXE: $bootstrap"; exit 1 }
          $arch = '${{ matrix.platform }}'.ToLower()
          python3 windows/scripts/build_msix.py `
            --exe $exe `
            --output "dist/${{ matrix.platform }}" `
            --vclibs "vclibs-$arch-extracted.appx" `
            --version 1.0.4.0 --arch $arch `
            --publisher $env:PUBLISHER `
            --base-url $env:BASE_URL `
            --self-signed-test-cert

      - name: List package contents
        shell: pwsh
        run: |
          $msix = Get-ChildItem "dist/${{ matrix.platform }}" -Filter *.msix | Select-Object -First 1
          Write-Host "MSIX: $($msix.FullName) ($($msix.Length) bytes)"
          tar -tf $msix.FullName

      - name: Upload MSIX artifacts
        uses: actions/upload-artifact@v4
        with:
          name: msix-${{ matrix.platform }}
          path: |
            dist/${{ matrix.platform }}/*.msix
            dist/${{ matrix.platform }}/*.appinstaller
            dist/${{ matrix.platform }}/*.appx
          if-no-files-found: error
