# opencode PR 自动审查
# 前置条件（一次性，需仓库管理员在网页完成）：
#   1. 安装 GitHub App: https://github.com/apps/opencode-agent
#   2. 添加 Actions secret: Settings → Secrets and variables → Actions → ANTHROPIC_API_KEY
# 或在仓库内运行 `opencode github install` 交互式完成以上配置。
name: opencode-review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: write
    steps:
      - uses: actions/checkout@v6
      - uses: anomalyco/opencode/github@latest
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: anthropic/claude-sonnet-5-5
          use_github_token: true
          # 不设 prompt 时，pull_request 事件默认执行 PR review
          prompt: |
            Review this pull request:
            - Check for code quality issues
            - Look for potential bugs, especially concurrency (Swift 6 strict mode) and coordinate-mapping regressions
            - Verify localization keys stay consistent across zh-Hans and en
            - Suggest improvements; keep comments concise and in Chinese
