name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_bump:
        description: 'Version bump from the latest release'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

env:
  PROJECT_NAME: TransFrame

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release version
        id: vars
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Tag pushes intentionally follow patch-only validation; use workflow_dispatch for minor/major releases.
          VERSION_BUMP: ${{ github.event.inputs.version_bump || 'patch' }}
        run: |
          set -euo pipefail

          bump_version() {
            local version="$1"
            local bump="$2"
            IFS=. read -r major minor patch <<< "$version"

            case "$bump" in
              patch)
                patch=$((patch + 1))
                ;;
              minor)
                minor=$((minor + 1))
                patch=0
                ;;
              major)
                major=$((major + 1))
                minor=0
                patch=0
                ;;
              *)
                echo "Unsupported version bump: $bump" >&2
                exit 1
                ;;
            esac

            echo "${major}.${minor}.${patch}"
          }

          latest_tag=$(gh release list --limit 100 --exclude-drafts --exclude-pre-releases --json tagName \
            --jq '[.[].tagName | select(test("^v[0-9]+\\.[0-9]+\\.[0-9]+$"))] | sort_by(split(".") | map(ltrimstr("v") | tonumber)) | last // empty')
          if [[ -z "$latest_tag" || ! "$latest_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Cannot determine latest semantic release tag. Latest tag: ${latest_tag:-<empty>}" >&2
            exit 1
          fi

          latest_version="${latest_tag#v}"
          expected_version=$(bump_version "$latest_version" "$VERSION_BUMP")
          expected_tag="v${expected_version}"

          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG_NAME=${GITHUB_REF#refs/tags/}
            VERSION=${GITHUB_REF#refs/tags/v}
            # Minor and major releases must be created with workflow_dispatch so the requested bump is explicit.
            if [[ "$TAG_NAME" != "$expected_tag" ]]; then
              echo "Refusing to release $TAG_NAME. Expected next $VERSION_BUMP release after $latest_tag is $expected_tag." >&2
              exit 1
            fi
          else
            TAG_NAME="$expected_tag"
            VERSION="$expected_version"
            if gh release view "$TAG_NAME" >/dev/null 2>&1; then
              echo "Release $TAG_NAME already exists." >&2
              exit 1
            fi
            if git ls-remote --exit-code --tags origin "refs/tags/$TAG_NAME" >/dev/null 2>&1; then
              echo "Tag $TAG_NAME already exists." >&2
              exit 1
            fi
          fi

          source_version=$(grep -m1 'MARKETING_VERSION' TransFrame.xcodeproj/project.pbxproj | sed 's/.*= *//;s/;//' | tr -d ' ')
          package_version=$(node -p "require('./package.json').version")

          echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "latest_tag=${latest_tag}" >> $GITHUB_OUTPUT
          echo "version_bump=${VERSION_BUMP}" >> $GITHUB_OUTPUT

          echo "Latest release: $latest_tag"
          echo "Resolved release: $TAG_NAME"
          echo "Source MARKETING_VERSION: $source_version"
          echo "package.json version: $package_version"

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.2'

      - name: Auto-increment build number
        env:
          REPOSITORY: ${{ github.repository }}
          RELEASE_VERSION: ${{ steps.vars.outputs.version }}
        run: |
          VERSION=${RELEASE_VERSION}
          
          # Get current build number from latest release's appcast
          APPCAST_BUILD=0
          LATEST_APPCAST=$(curl -sL "https://github.com/${REPOSITORY}/releases/latest/download/appcast.xml" 2>/dev/null || echo "")
          
          if [ -n "$LATEST_APPCAST" ]; then
            APPCAST_BUILD=$(echo "$LATEST_APPCAST" | grep -o '<sparkle:version>[^<]*</sparkle:version>' | sed 's/<[^>]*>//g' | head -1)
            echo "Current build number from appcast: $APPCAST_BUILD"
          fi

          if ! [[ "$APPCAST_BUILD" =~ ^[0-9]+$ ]]; then
            echo "Ignoring invalid appcast build number: $APPCAST_BUILD"
            APPCAST_BUILD=0
          fi

          SOURCE_BUILD=$(grep -m1 'CURRENT_PROJECT_VERSION' TransFrame.xcodeproj/project.pbxproj | sed 's/.*= *//;s/;//' | tr -d ' ')
          if ! [[ "$SOURCE_BUILD" =~ ^[0-9]+$ ]]; then
            echo "Invalid source build number: $SOURCE_BUILD" >&2
            exit 1
          fi

          CURRENT_BUILD=$APPCAST_BUILD
          if [ "$SOURCE_BUILD" -gt "$CURRENT_BUILD" ]; then
            CURRENT_BUILD=$SOURCE_BUILD
          fi
          echo "Current build baseline: $CURRENT_BUILD"
          
          # Increment build number
          NEW_BUILD=$((CURRENT_BUILD + 1))
          echo "New build number: $NEW_BUILD"
          
          # Update project.pbxproj
          sed -i '' "s/CURRENT_PROJECT_VERSION = [0-9]*;/CURRENT_PROJECT_VERSION = $NEW_BUILD;/g" TransFrame.xcodeproj/project.pbxproj
          sed -i '' "s/MARKETING_VERSION = [^;]*;/MARKETING_VERSION = $VERSION;/g" TransFrame.xcodeproj/project.pbxproj
          
          echo "Updated to version $VERSION (build $NEW_BUILD)"
          echo "new_build=$NEW_BUILD" >> $GITHUB_OUTPUT

      - name: Import Apple Certificate
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE }}
          P12_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERTIFICATE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security import "$CERTIFICATE_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychains -s "$KEYCHAIN_PATH" $(security list-keychains | tr -d '"')
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

      - name: Build Release
        run: |
          xcodebuild -project ${{ env.PROJECT_NAME }}.xcodeproj \
            -scheme ${{ env.PROJECT_NAME }} \
            -configuration Release \
            -derivedDataPath build \
            -destination 'platform=macOS' \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGN_STYLE=Automatic \
            MACOSX_DEPLOYMENT_TARGET=26.0 \
            ARCHS=arm64 \
            clean build

      - name: Sign App & Create DMG
        id: create_dmg
        run: |
          # Dynamically resolve signing identity from imported keychain (prioritizing Developer ID Application)
          SIGN_IDENTITY=$(security find-identity -v -p codesigning "$RUNNER_TEMP/app-signing.keychain-db" | grep -m1 "Developer ID Application" | awk -F '"' '{print $2}' || true)
          if [ -z "$SIGN_IDENTITY" ]; then
            SIGN_IDENTITY=$(security find-identity -v -p codesigning "$RUNNER_TEMP/app-signing.keychain-db" | head -1 | awk -F '"' '{print $2}' || true)
          fi

          if [ -n "$SIGN_IDENTITY" ]; then
            echo "Signing application bundle with: $SIGN_IDENTITY"
            codesign --force --deep --options runtime --timestamp=none \
              --sign "$SIGN_IDENTITY" \
              build/Build/Products/Release/${{ env.PROJECT_NAME }}.app
          else
            echo "Warning: No code signing identity found, falling back to ad-hoc signing"
            codesign --force --deep --sign - \
              build/Build/Products/Release/${{ env.PROJECT_NAME }}.app
          fi

          mkdir -p dmg_temp
          cp -R build/Build/Products/Release/${{ env.PROJECT_NAME }}.app dmg_temp/
          ln -sf /Applications dmg_temp/Applications

          VERSION=${{ steps.vars.outputs.version }}
          DMG_FILE="${{ env.PROJECT_NAME }}-${VERSION}.dmg"
          ARM64_DMG_FILE="${{ env.PROJECT_NAME }}-${VERSION}-arm64.dmg"

          hdiutil create -volname "${{ env.PROJECT_NAME }}" \
            -srcfolder dmg_temp \
            -ov -format UDZO \
            "$DMG_FILE"

          # arm64-only build; keep the un-suffixed name for backward compatibility,
          # but release notes state this is an arm64-only artifact (see Create Release body).
          cp "$DMG_FILE" "$ARM64_DMG_FILE"

          # Get file size
          DMG_SIZE=$(stat -f%z "$DMG_FILE")
          echo "dmg_size=$DMG_SIZE" >> $GITHUB_OUTPUT
          echo "dmg_file=$DMG_FILE" >> $GITHUB_OUTPUT

          rm -rf dmg_temp

      - name: Notarize & Staple App
        id: notarize
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          APP_PATH="build/Build/Products/Release/${{ env.PROJECT_NAME }}.app"
          VERSION=${{ steps.vars.outputs.version }}

          if [ -z "$APPLE_ID" ] || [ -z "$APPLE_APP_SPECIFIC_PASSWORD" ] || [ -z "$APPLE_TEAM_ID" ]; then
            echo "Warning: Notarization secrets not configured, skipping notarization"
            echo "notarized=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          if codesign -dv "$APP_PATH" 2>&1 | grep -q "Signature=adhoc"; then
            echo "Warning: App is ad-hoc signed, skipping notarization"
            echo "notarized=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "Creating ZIP for notarization submission..."
          ZIP_PATH="$RUNNER_TEMP/${{ env.PROJECT_NAME }}-${VERSION}-notarize.zip"
          ditto -c -k --keepParent "$APP_PATH" "$ZIP_PATH"

          echo "Submitting to Apple notarization service..."
          xcrun notarytool submit "$ZIP_PATH" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait \
            --timeout 30m

          echo "Stapling notarization ticket to app..."
          xcrun stapler staple "$APP_PATH"

          echo "Verifying notarization..."
          xcrun stapler validate "$APP_PATH"
          spctl --assess --type execute --verbose "$APP_PATH"

          echo "Notarization complete."

          echo "Recreating DMG with stapled app..."
          DMG_FILE="${{ env.PROJECT_NAME }}-${VERSION}.dmg"
          ARM64_DMG_FILE="${{ env.PROJECT_NAME }}-${VERSION}-arm64.dmg"

          mkdir -p dmg_temp
          cp -R "$APP_PATH" dmg_temp/
          ln -sf /Applications dmg_temp/Applications

          hdiutil create -volname "${{ env.PROJECT_NAME }}" \
            -srcfolder dmg_temp \
            -ov -format UDZO \
            "$DMG_FILE"

          cp "$DMG_FILE" "$ARM64_DMG_FILE"

          echo "Notarizing DMG..."
          DMG_ZIP="$RUNNER_TEMP/${{ env.PROJECT_NAME }}-${VERSION}-dmg.zip"
          ditto -c -k --keepParent "$DMG_FILE" "$DMG_ZIP"

          xcrun notarytool submit "$DMG_ZIP" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait \
            --timeout 30m

          xcrun stapler staple "$DMG_FILE"
          cp "$DMG_FILE" "$ARM64_DMG_FILE"

          rm -rf dmg_temp
          rm -f "$ZIP_PATH" "$DMG_ZIP"

          # Update DMG size for appcast (may have changed after notarization)
          NEW_DMG_SIZE=$(stat -f%z "$DMG_FILE")
          echo "dmg_size=$NEW_DMG_SIZE" >> $GITHUB_OUTPUT
          echo "notarized=true" >> $GITHUB_OUTPUT

      - name: Sign DMG for Sparkle
        id: sign_dmg
        run: |
          VERSION=${{ steps.vars.outputs.version }}
          DMG_FILE="${{ env.PROJECT_NAME }}-${VERSION}.dmg"
          
          # Find sign_update tool in derived data
          SIGN_TOOL=$(find build/SourcePackages/artifacts -name "sign_update" -type f | head -1)
          
          if [ -z "$SIGN_TOOL" ]; then
            echo "sign_update tool not found, checking alternative locations..."
            SIGN_TOOL=$(find build -name "sign_update" -type f | head -1)
          fi
          
          if [ -n "$SIGN_TOOL" ]; then
            echo "Found sign_update at: $SIGN_TOOL"
            # Sign the DMG and get the signature
            SIGNATURE=$(echo "${{ secrets.SPARKLE_PRIVATE_KEY }}" | "$SIGN_TOOL" --ed-key-file - -p "$DMG_FILE" 2>&1)
            echo "Signature: $SIGNATURE"
            echo "signature=$SIGNATURE" >> $GITHUB_OUTPUT
          else
            echo "sign_update tool not found, skipping signing"
            echo "signature=" >> $GITHUB_OUTPUT
          fi

      - name: Generate pubDate
        id: pubdate
        run: echo "date=$(date -Ru)" >> $GITHUB_OUTPUT

      - name: Get Build Number
        id: build_number
        run: |
          # Extract build number from project
          BUILD_NUM=$(grep -m1 'CURRENT_PROJECT_VERSION' TransFrame.xcodeproj/project.pbxproj | sed 's/.*= *//;s/;//' | tr -d ' ')
          echo "build_num=$BUILD_NUM" >> $GITHUB_OUTPUT

      - name: Get Tag Message
        id: tag_message
        env:
          TAG_NAME: ${{ steps.vars.outputs.tag_name }}
        run: |
          # Get the tag annotation message (remove trailing PGP signature using POSIX-compatible sed)
          TAG_MESSAGE=$(git tag -l --format='%(contents)' "$TAG_NAME" | sed '/^-----BEGIN PGP SIGNATURE-----/,$d' || echo "")
          # If tag message is empty, use a default message
          if [ -z "$TAG_MESSAGE" ]; then
            TAG_MESSAGE="Latest release of TransFrame"
          fi
          # Escape CDATA boundaries for safe XML wrapping (not entity escaping, since we use CDATA)
          TAG_MESSAGE=$(echo "$TAG_MESSAGE" | sed 's/]]>/]]]]><![CDATA[>/g')
          # Generate a unique delimiter to avoid collision with message content
          DELIMITER="EOF_$(uuidgen | tr -d '-')"
          echo "message<<${DELIMITER}" >> $GITHUB_OUTPUT
          echo "$TAG_MESSAGE" >> $GITHUB_OUTPUT
          echo "${DELIMITER}" >> $GITHUB_OUTPUT

      - name: Generate Sparkle Appcast
        env:
          RELEASE_NOTES: ${{ steps.tag_message.outputs.message }}
        run: |
          VERSION=${{ steps.vars.outputs.version }}
          BUILD_NUM="${{ steps.build_number.outputs.build_num }}"
          DMG_URL="https://github.com/${{ github.repository }}/releases/download/${{ steps.vars.outputs.tag_name }}/${{ env.PROJECT_NAME }}-${VERSION}.dmg"
          PUBDATE="${{ steps.pubdate.outputs.date }}"
          DMG_SIZE="${{ steps.notarize.outputs.dmg_size || steps.create_dmg.outputs.dmg_size }}"
          SIGNATURE="${{ steps.sign_dmg.outputs.signature }}"
          
          # Build enclosure tag with or without signature
          if [ -n "$SIGNATURE" ]; then
            ENCLOSURE="<enclosure url=\"${DMG_URL}\" length=\"${DMG_SIZE}\" type=\"application/octet-stream\" sparkle:edSignature=\"${SIGNATURE}\" />"
          else
            ENCLOSURE="<enclosure url=\"${DMG_URL}\" length=\"${DMG_SIZE}\" type=\"application/octet-stream\" />"
          fi

          # Generate unique delimiter to avoid collision with release notes content
          APPCAST_DELIMITER="APPCAST_EOF_$(uuidgen | tr -d '-')"
          cat > appcast.xml << ${APPCAST_DELIMITER}
          <?xml version="1.0" encoding="utf-8"?>
          <rss version="2.0" xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle" xmlns:dc="http://purl.org/dc/elements/1.1/">
            <channel>
              <title>${{ env.PROJECT_NAME }} Updates</title>
              <link>https://github.com/${{ github.repository }}/releases</link>
              <description>Most recent changes with links to updates.</description>
              <language>en</language>
              <item>
                <title>Version ${VERSION}</title>
                <pubDate>${PUBDATE}</pubDate>
                <sparkle:version>${BUILD_NUM}</sparkle:version>
                <sparkle:shortVersionString>${VERSION}</sparkle:shortVersionString>
                <sparkle:minimumSystemVersion>26.0</sparkle:minimumSystemVersion>
                ${ENCLOSURE}
                <description><![CDATA[${RELEASE_NOTES}]]></description>
              </item>
            </channel>
          </rss>
          ${APPCAST_DELIMITER}
          
          echo "Generated appcast.xml:"
          cat appcast.xml

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag_name }}
          target_commitish: ${{ github.sha }}
          files: |
            ${{ env.PROJECT_NAME }}-*.dmg
            appcast.xml
          generate_release_notes: true
          body: |
            > **注意**：本次构建为 **arm64-only**。`$NAME-$VERSION.dmg` 与 `$NAME-$VERSION-arm64.dmg` 为同一 arm64 产物（无后缀名为向后兼容保留），不含 x86_64 切片。
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cleanup
        if: always()
        run: |
          security delete-keychain $RUNNER_TEMP/app-signing.keychain-db 2>/dev/null || true
          rm -rf build
